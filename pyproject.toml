[project]
name = "lerax"
version = "0.0.6"
description = "Deep Reinforcement Learning with JAX and Equinox."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Theodore Pinkerton", email = "ted@tedpinkerton.ca" }]
dependencies = [
  "asciichartpy>=1.5.25",
  "diffrax>=0.7.0",
  "distreqx>=0.0.2",
  "equinox>=0.13.3",
  "flax>=0.12.2",
  "gymnasium>=1.2.3",
  "gymnax>=0.0.9",
  "imageio>=2.37.2",
  "imageio-ffmpeg>=0.6.0",
  "jax>=0.9.0",
  "jaxtyping>=0.3.6",
  "moviepy>=2.2.1",
  "mujoco-mjx>=3.4.0",
  "once-py>=0.0.8",
  "optax>=0.2.6",
  "pygame>=2.6.1",
  "rich>=14.3.1",
  "tensorboard>=2.20.0",
  "tensorboardX>=2.6.4",
  "wandb>=0.25.0",
]

[project.urls]
documentation = "https://lerax.tedpinkerton.ca/"
homepage = "https://lerax.tedpinkerton.ca/"
issues = "https://github.com/RunnersNum40/lerax/issues"
source = "https://github.com/RunnersNum40/lerax.git"

[project.optional-dependencies]
# jax2onnx <=0.17.1 imports `ClosedJaxpr` from `jax._src.core`, removed in jax 0.12.
onnx = ["jax2onnx>=0.12.0", "onnx>=1.17.0", "jax<0.12"]

[dependency-groups]
dev = [
  "gymnasium>=1.4.0",
  "gymnax>=0.0.9",
  "jax2onnx>=0.17.1",
  "mkdocstrings-python>=2.0.10",
  "mujoco-mjx>=3.17.0",
  "onnx>=1.23.2",
  "onnxruntime>=1.31.0",
  "prek>=0.5.7",
  "pygame>=2.6.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17.2",
  "setuptools<84",
  "stable-baselines3>=2.9.0",
  "ty>=0.0.91",
  "zensical>=0.0.72",
]

# For contributors using pyright instead of ty
[tool.pyright]
reportIncompatibleVariableOverride = false      # Required by eqx.AbstractVar
stubPath = "stubs"
include = ["src/**", "examples/**", "tests/**"]

[tool.pytest]
addopts = ["--cov=lerax", "--import-mode=importlib"]
strict = true
testpaths = ["tests"]

[tool.ruff]
exclude = ["stubs"]

[tool.ruff.format]
docstring-code-format = true
exclude = ["*.md"]

[tool.ruff.lint]
fixable = ["I001", "F401"]
ignore = ["E402", "E721", "E731", "E741", "F722", "E501"]
select = ["E", "F", "I001"]

[tool.setuptools.package-data]
lerax = ["env/mujoco/assets/**", "env/unitree/g1/assets/**"]

[tool.ty]
[tool.ty.rules]
# Equinox AbstractVar fields are narrowed, or implemented as properties or ClassVars, by subclasses.
invalid-attribute-override = "ignore"
invalid-mutable-override = "ignore"
invalid-property-type-override = "ignore"

[tool.ty.src]
include = ["src", "examples", "tests"]

[tool.ty.environment]
extra-paths = ["stubs"]

[tool.typos]
[tool.typos.files]
extend-exclude = ["stubs"]

[tool.uv]
package = true
# jaxtyping <=0.3.11 fails to import under numpy 2.5; fixed by patrick-kidger/jaxtyping@5123365d.
constraint-dependencies = ["numpy<2.5"]

[tool.uv.sources]
equinox = { git = "https://github.com/patrick-kidger/equinox.git", branch = "main" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
